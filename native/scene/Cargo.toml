[package]
name = "we_scene"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# MIT OR Apache-2.0, clean-room Wallpaper Engine scene renderer on GLES.
apolline-scene = { path = "vendor/apolline-scene" }
glow = "0.16"
jni = "0.21"
serde_json = "1"
# apolline-scene uses rquickjs, which ships no prebuilt Android bindings: generate them (libclang from the NDK).
rquickjs = { version = "0.14", features = ["bindgen"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4
[workspace]
